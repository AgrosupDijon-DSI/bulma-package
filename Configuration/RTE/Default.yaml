imports:
  - { resource: 'EXT:rte_ckeditor/Configuration/RTE/Processing.yaml' }
  - { resource: 'EXT:rte_ckeditor/Configuration/RTE/Editor/Base.yaml' }
  - { resource: 'EXT:rte_ckeditor/Configuration/RTE/Editor/Plugins.yaml' }

editor:
  config:
    importModules:
      - { 'module': '@ckeditor/ckeditor5-table', 'exports': [ 'TableColumnResize' ] }

    contentsCss:
      - 'EXT:bulma_package/Resources/Public/Build/rte.min.css'

    heading:
      options:
        - { model: 'paragraph', title: 'Paragraph' }
        - { model: 'heading2', view: 'h2', title: 'Heading 2' }
        - { model: 'heading3', view: 'h3', title: 'Heading 3' }
        - { model: 'heading4', view: 'h4', title: 'Heading 4' }
        - { model: 'heading5', view: 'h5', title: 'Heading 5' }

    style:
      definitions:
        ## Block level styles
        # Box
        - { name: 'bulma_package.rte:style.box', element: 'p', classes: [ 'box' ] }
        # Notifications
        - { name: 'bulma_package.rte:style.notification', element: 'p', classes: [ 'notification' ] }
        - { name: 'bulma_package.rte:style.notification.primary', element: 'p', classes: [ 'notification', 'is-primary' ] }
        - { name: 'bulma_package.rte:style.notification.success', element: 'p', classes: [ 'notification', 'is-success' ] }
        - { name: 'bulma_package.rte:style.notification.info', element: 'p', classes: [ 'notification', 'is-info' ] }
        - { name: 'bulma_package.rte:style.notification.warning', element: 'p', classes: [ 'notification', 'is-warning' ] }
        - { name: 'bulma_package.rte:style.notification.danger', element: 'p', classes: [ 'notification', 'is-danger' ] }
        - { name: 'bulma_package.rte:style.notification.light', element: 'p', classes: [ 'notification', 'is-light' ] }
        # Sizes
        - { name: 'bulma_package.rte:style.bloc-size.1', element: 'p', classes: [ 'is-size-1' ] }
        - { name: 'bulma_package.rte:style.bloc-size.2', element: 'p', classes: [ 'is-size-2' ] }
        - { name: 'bulma_package.rte:style.bloc-size.3', element: 'p', classes: [ 'is-size-3' ] }
        - { name: 'bulma_package.rte:style.bloc-size.4', element: 'p', classes: [ 'is-size-4' ] }
        - { name: 'bulma_package.rte:style.bloc-size.5', element: 'p', classes: [ 'is-size-5' ] }
        - { name: 'bulma_package.rte:style.bloc-size.6', element: 'p', classes: [ 'is-size-6' ] }
        # Button container
        - { name: 'bulma_package.rte:style.buttons', element: 'p', classes: [ 'buttons' ] }
        # Table
        - { name: 'bulma_package.rte:style.table.bordered', element: 'table', classes: [ 'table', 'is-bordered' ] }

        ## Inline styles
        # Buttons
        - { name: 'bulma_package.rte:style.button', element: 'a', classes: [ 'button' ] }
        - { name: 'bulma_package.rte:style.button.primary', element: 'a', classes: [ 'button', 'is-primary' ] }
        - { name: 'bulma_package.rte:style.button.success', element: 'a', classes: [ 'button', 'is-success' ] }
        - { name: 'bulma_package.rte:style.button.info', element: 'a', classes: [ 'button', 'is-info' ] }
        - { name: 'bulma_package.rte:style.button.warning', element: 'a', classes: [ 'button', 'is-warning' ] }
        - { name: 'bulma_package.rte:style.button.danger', element: 'a', classes: [ 'button', 'is-danger' ] }
        - { name: 'bulma_package.rte:style.button.light', element: 'a', classes: [ 'button', 'is-light' ] }
        - { name: 'bulma_package.rte:style.button.dark', element: 'a', classes: [ 'button', 'is-dark' ] }
        - { name: 'bulma_package.rte:style.button.fullwidth', element: 'a', classes: [ 'button', 'is-fullwidth' ] }
        # Link classes
        - { name: 'bulma_package.rte:style.link.mail', element: 'a', classes: [ 'icon-mail' ] }
        - { name: 'bulma_package.rte:style.link.phone', element: 'a', classes: [ 'icon-phone' ] }
        - { name: 'bulma_package.rte:style.link.file', element: 'a', classes: [ 'icon-file' ] }
        - { name: 'bulma_package.rte:style.link.url', element: 'a', classes: [ 'icon-url' ] }
        - { name: 'bulma_package.rte:style.link.location', element: 'a', classes: [ 'icon-location' ] }
        # Text colors
        - { name: 'bulma_package.rte:style.primary', element: 'span', classes: [ 'has-text-primary' ] }
        - { name: 'bulma_package.rte:style.success', element: 'span', classes: [ 'has-text-success' ] }
        - { name: 'bulma_package.rte:style.info', element: 'span', classes: [ 'has-text-info' ] }
        - { name: 'bulma_package.rte:style.warning', element: 'span', classes: [ 'has-text-warning' ] }
        - { name: 'bulma_package.rte:style.danger', element: 'span', classes: [ 'has-text-danger' ] }
        - { name: 'bulma_package.rte:style.light', element: 'span', classes: [ 'has-text-light' ] }
        - { name: 'bulma_package.rte:style.dark', element: 'span', classes: [ 'has-text-dark' ] }
        # Sizes
        - { name: 'bulma_package.rte:style.size.1', element: 'span', classes: [ 'is-size-1' ] }
        - { name: 'bulma_package.rte:style.size.2', element: 'span', classes: [ 'is-size-2' ] }
        - { name: 'bulma_package.rte:style.size.3', element: 'span', classes: [ 'is-size-3' ] }
        - { name: 'bulma_package.rte:style.size.4', element: 'span', classes: [ 'is-size-4' ] }
        - { name: 'bulma_package.rte:style.size.5', element: 'span', classes: [ 'is-size-5' ] }
        - { name: 'bulma_package.rte:style.size.6', element: 'span', classes: [ 'is-size-6' ] }
        # Highlightment
        - { name: 'bulma_package.rte:style.highlighted', element: 'span', classes: [ 'has-background-primary-light' ] }

    toolbar:
      items:
        - style
        - heading
        - '|'
        - clipboard
        - removeFormat
        - undo
        - redo
        # grouping separator
        - '|'
        - insertTable
        - '|'
        - link
        # line break
        - '-'
        - bold
        - italic
        - underline
        - strikethrough
        - '|'
        - subscript
        - superscript
        - softhyphen
        - '|'
        - bulletedList
        - numberedList
        - '|'
        - blockQuote
        - horizontalLine
        - '|'
        - indent
        - outdent
        - alignment:left
        - alignment:center
        - alignment:right
        - '|'
        - specialCharacters
        - '|'
        - sourceEditing

    alignment:
      options:
        - { name: 'left', className: 'has-text-left' }
        - { name: 'center', className: 'has-text-centered' }
        - { name: 'right', className: 'has-text-right' }

    table:
      defaultHeadings: { rows: 1 }
      contentToolbar:
        - tableColumn
        - tableRow
        - mergeTableCells
        - tableProperties
        - tableCellProperties
        - toggleTableCaption
      tableCellProperties: { defaultProperties: { verticalAlignment: 'top' } }
